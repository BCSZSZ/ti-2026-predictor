      .winner-row { fill: #d4a64e; }
      .winner { fill: #15171b; font: 750 16px "Segoe UI", "Microsoft YaHei", sans-serif; }
      .check { fill: #15171b; font: 800 17px "Segoe UI Symbol", "Segoe UI", sans-serif; }
