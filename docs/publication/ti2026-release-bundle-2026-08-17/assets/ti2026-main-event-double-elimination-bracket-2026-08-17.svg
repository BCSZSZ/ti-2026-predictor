<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1100" viewBox="0 0 1920 1100" role="img" aria-labelledby="title desc">
  <title id="title">TI 2026 Main Event 双败淘汰赛预测树</title>
  <desc id="desc">胜者组从四场首轮进入半决赛和胜者组决赛，败者进入败者组；TEAM VISION 被推荐在总决赛击败 Team Liquid 夺冠。</desc>
